name: Build and Deploy Order Service

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}

  deploy:
    name: Deploy on Ubuntu VM
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull and deploy image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          IMAGE="$DOCKERHUB_USERNAME/order-service:$IMAGE_TAG"

          docker pull "$IMAGE"

          docker stop order-service || true
          docker rm order-service || true

          docker run -d \
            --name order-service \
            --restart unless-stopped \
            -p 8081:8080 \
            "$IMAGE"

          docker image prune -f